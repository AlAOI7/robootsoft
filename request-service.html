<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طلب خدمة | Robotsoft ERP</title>
    <meta name="description" content="اطلب خدمات Robotsoft ERP لتطوير أعمالك، من الأنظمة المحاسبية إلى تصميم وتطوير مواقع وتطبيقات الجوال.">
    <meta name="keywords" content="طلب نظام محاسبي, طلب تطبيق, تصميم موقع, خدمات Robotsoft">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/jpeg" href="assets/logo.jpeg">
</head>
<body>
    
    <!-- Navigation Header -->
    <header class="header">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <img src="assets/logo.jpeg" alt="Robotsoft Logo" class="logo-img">
                <span data-ar="روبوت سوفت" data-en="Robotsoft ERP">روبوت سوفت</span>
            </a>
            <nav class="nav-menu">
                <a href="index.html" class="nav-link" data-ar="الرئيسية" data-en="Home">الرئيسية</a>
                <a href="about.html" class="nav-link" data-ar="من نحن" data-en="About Us">من نحن</a>
                <a href="services.html" class="nav-link" data-ar="الخدمات" data-en="Services">الخدمات</a>
                <a href="projects.html" class="nav-link" data-ar="المشاريع" data-en="Projects">المشاريع</a>
                <a href="contact.html" class="nav-link" data-ar="اتصل بنا" data-en="Contact">اتصل بنا</a>
            </nav>
            <div class="nav-controls">
                <a href="login.html" class="nav-cta" style="background: transparent; color: var(--primary); border: 1px solid var(--primary);" data-ar="تسجيل الدخول" data-en="Login">تسجيل الدخول</a>
            </div>
        </div>
    </header>

    <!-- Page Hero -->
    <section class="page-hero">
        <div class="container page-hero-container">
            <h1 class="page-hero-title reveal" data-ar="طلب خدمة" data-en="Request Service">طلب خدمة</h1>
        </div>
    </section>

    <!-- Request Service Form Section -->
    <section class="section">
        <div class="container" style="display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; align-items: start;">
            <div class="reveal" style="background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:var(--border-radius-lg);padding:2.5rem;">
                <h3 style="font-weight:800;margin-bottom:1.5rem;color:var(--text-primary); text-align:center;" data-ar="نموذج طلب الخدمة" data-en="Service Request Form">نموذج طلب الخدمة</h3>
                <p style="text-align:center; color:var(--text-secondary); margin-bottom: 2rem;" data-ar="يرجى تعبئة النموذج أدناه لتوضيح متطلباتك، وسيقوم فريقنا بالتواصل معك في أقرب وقت." data-en="Please fill out the form below and our team will get back to you shortly.">يرجى تعبئة النموذج أدناه لتوضيح متطلباتك، وسيقوم فريقنا بالتواصل معك في أقرب وقت.</p>
                <form id="serviceForm" style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;" onsubmit="event.preventDefault(); window.open('https://wa.me/966500000000?text=' + encodeURIComponent('طلب خدمة جديدة:\nالاسم: ' + document.getElementById('name').value + '\nرقم الجوال: ' + document.getElementById('phone').value + '\nالخدمة المطلوبة: ' + document.getElementById('service').options[document.getElementById('service').selectedIndex].text + '\nالتفاصيل: ' + document.getElementById('details').value), '_blank');">
                    <div style="grid-column:span 1;">
                        <label style="display:block;margin-bottom:0.5rem;font-size:0.9rem;font-weight:700;" data-ar="الاسم الكريم" data-en="Full Name">الاسم الكريم</label>
                        <input type="text" id="name" required style="width:100%;background:var(--bg-primary);border:1px solid var(--border-color);border-radius:var(--border-radius-md);padding:0.8rem;color:var(--text-primary);">
                    </div>
                    <div style="grid-column:span 1;">
                        <label style="display:block;margin-bottom:0.5rem;font-size:0.9rem;font-weight:700;" data-ar="رقم الجوال" data-en="Mobile Number">رقم الجوال</label>
                        <input type="tel" id="phone" required placeholder="05xxxxxxxx" style="width:100%;background:var(--bg-primary);border:1px solid var(--border-color);border-radius:var(--border-radius-md);padding:0.8rem;color:var(--text-primary);">
                    </div>
                    <div style="grid-column:span 2;">
                        <label style="display:block;margin-bottom:0.5rem;font-size:0.9rem;font-weight:700;" data-ar="الخدمة المطلوبة" data-en="Requested Service">الخدمة المطلوبة</label>
                        <select id="service" required style="width:100%;background:var(--bg-primary);border:1px solid var(--border-color);border-radius:var(--border-radius-md);padding:0.8rem;color:var(--text-primary); cursor:pointer;">
                            <option value="" disabled selected data-ar="-- اختر الخدمة --" data-en="-- Select Service --">-- اختر الخدمة --</option>
                            <option value="accounting" data-ar="النظام المحاسبي" data-en="Accounting System">النظام المحاسبي</option>
                            <option value="website" data-ar="موقع إلكتروني" data-en="Website">موقع إلكتروني</option>
                            <option value="mobile_app" data-ar="تطبيق جوال" data-en="Mobile App">تطبيق جوال</option>
                            <option value="other" data-ar="أخرى" data-en="Other">أخرى</option>
                        </select>
                    </div>
                    <div style="grid-column:span 2;">
                        <label style="display:block;margin-bottom:0.5rem;font-size:0.9rem;font-weight:700;" data-ar="تفاصيل الطلب (اختياري)" data-en="Request Details (Optional)">تفاصيل الطلب (اختياري)</label>
                        <textarea id="details" rows="5" placeholder="..." style="width:100%;background:var(--bg-primary);border:1px solid var(--border-color);border-radius:var(--border-radius-md);padding:0.8rem;color:var(--text-primary);resize:vertical;"></textarea>
                    </div>
                    <div style="grid-column:span 2;">
                        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">
                            <span data-ar="إرسال الطلب عبر WhatsApp" data-en="Send Request via WhatsApp">إرسال الطلب عبر WhatsApp</span>
                        </button>
                    </div>
                </form>
            </div>
            <div class="reveal" style="text-align: center;">
                <img src="assets/request_service.png" alt="Request Service" style="max-width: 100%; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); object-fit: cover;">
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container footer-grid">
            <div class="footer-logo-panel">
                <a href="index.html" class="logo" style="margin-bottom:1rem;">
                    <img src="assets/logo.jpeg" alt="Robotsoft Logo" class="logo-img">
                    <span data-ar="روبوت سوفت" data-en="Robotsoft ERP">روبوت سوفت</span>
                </a>
            </div>
        </div>
        <div class="container footer-bottom">
            <span data-ar="© 2026 Robotsoft ERP. جميع الحقوق محفوظة." data-en="© 2026 Robotsoft ERP. All rights reserved.">© 2026 Robotsoft ERP. جميع الحقوق محفوظة.</span>
        </div>
    </footer>
    
    <script src="js/main.js"></script>
</body>
</html>
