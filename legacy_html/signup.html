<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب مجاني | Robotsoft ERP - أفضل نظام محاسبي</title>
    <meta name="description" content="اشترك الآن في Robotsoft ERP واحصل على أقوى نظام محاسبي سحابي في السعودية لإدارة شركتك، مبيعاتك، نقاط البيع، والموارد البشرية.">
    <meta name="keywords" content="إنشاء حساب ERP, تسجيل Robotsoft, اشتراك برنامج محاسبة, نظام محاسبي مجاني تجريبي, أفضل برنامج مبيعات, إدارة شركات, نظام ZATCA">
    <meta property="og:title" content="إنشاء حساب جديد | Robotsoft ERP">
    <meta property="og:description" content="ابدأ رحلة التحول الرقمي مع أقوى الأنظمة السحابية في المنطقة.">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/jpeg" href="assets/logo.jpeg">
    <style>
        .auth-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; background: #0f172a; padding: 2rem 0; }
        .auth-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .auth-card { position: relative; z-index: 2; width: 100%; max-width: 550px; background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 3rem; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .auth-logo { text-align: center; margin-bottom: 2rem; }
        .auth-logo img { width: 60px; height: 60px; border-radius: 12px; margin-bottom: 1rem; }
        .auth-logo h2 { font-size: 1.8rem; font-weight: 800; color: #fff; }
        .auth-logo p { color: var(--text-muted); font-size: 0.95rem; margin-top: 0.5rem; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
        .form-group { margin-bottom: 1.5rem; }
        .form-group.full { grid-column: span 2; }
        @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; gap: 0; } .form-group.full { grid-column: span 1; } }
        .form-label { display: block; font-size: 0.9rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.5rem; }
        .form-input { width: 100%; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 1rem; color: #fff; font-size: 1rem; transition: all 0.3s ease; }
        .form-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(37,99,235,0.1); }
        .auth-btn { width: 100%; padding: 1rem; border: none; border-radius: 12px; background: var(--gradient-primary); color: #fff; font-weight: 700; font-size: 1.1rem; cursor: pointer; transition: all 0.3s ease; margin-top: 1rem; }
        .auth-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(37,99,235,0.3); }
        .auth-footer { text-align: center; margin-top: 2rem; font-size: 0.95rem; color: var(--text-secondary); }
        .auth-footer a { color: var(--primary); font-weight: 600; text-decoration: none; }
        .auth-footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="auth-container">
        <canvas id="auth-canvas" class="auth-canvas"></canvas>
        <div class="auth-card">
            <div class="auth-logo">
                <a href="index.html">
                    <img src="assets/logo.jpeg" alt="Robotsoft Logo">
                </a>
                <h2 data-ar="إنشاء حساب جديد" data-en="Create Account">إنشاء حساب جديد</h2>
                <p data-ar="ابدأ رحلة التحول الرقمي مع Robotsoft" data-en="Start your digital transformation journey">ابدأ رحلة التحول الرقمي مع Robotsoft</p>
            </div>
            
            <form onsubmit="event.preventDefault(); window.location.href='index.html';">
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label" data-ar="الاسم الأول" data-en="First Name">الاسم الأول</label>
                        <input type="text" class="form-input" required placeholder="محمد">
                    </div>
                    <div class="form-group">
                        <label class="form-label" data-ar="الاسم الأخير" data-en="Last Name">الاسم الأخير</label>
                        <input type="text" class="form-input" required placeholder="أحمد">
                    </div>
                    <div class="form-group full">
                        <label class="form-label" data-ar="اسم الشركة / المؤسسة" data-en="Company Name">اسم الشركة / المؤسسة</label>
                        <input type="text" class="form-input" required placeholder="شركة الأفق للتجارة">
                    </div>
                    <div class="form-group full">
                        <label class="form-label" data-ar="البريد الإلكتروني للعمل" data-en="Work Email">البريد الإلكتروني للعمل</label>
                        <input type="email" class="form-input" required placeholder="name@company.com">
                    </div>
                    <div class="form-group">
                        <label class="form-label" data-ar="رقم الجوال" data-en="Phone Number">رقم الجوال</label>
                        <input type="tel" class="form-input" required placeholder="05xxxxxxxx">
                    </div>
                    <div class="form-group">
                        <label class="form-label" data-ar="كلمة المرور" data-en="Password">كلمة المرور</label>
                        <input type="password" class="form-input" required placeholder="••••••••">
                    </div>
                </div>
                
                <label style="display: flex; align-items: start; gap: 0.5rem; color: var(--text-secondary); cursor: pointer; margin-top: 1rem; font-size: 0.85rem;">
                    <input type="checkbox" required style="accent-color: var(--primary); margin-top: 0.2rem;">
                    <span data-ar="أوافق على شروط الخدمة وسياسة الخصوصية الخاصة بـ Robotsoft." data-en="I agree to Robotsoft's Terms of Service and Privacy Policy.">أوافق على شروط الخدمة وسياسة الخصوصية الخاصة بـ Robotsoft.</span>
                </label>

                <button type="submit" class="auth-btn" data-ar="إنشاء الحساب" data-en="Create Account">إنشاء الحساب</button>
            </form>

            <div class="auth-footer">
                <span data-ar="لديك حساب بالفعل؟" data-en="Already have an account?">لديك حساب بالفعل؟</span> 
                <a href="login.html" data-ar="تسجيل الدخول" data-en="Sign in">تسجيل الدخول</a>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('auth-canvas');
            if (canvas && window.innerWidth > 768) {
                const ctx = canvas.getContext('2d');
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                const stars = Array.from({length: 100}).map(() => ({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    s: Math.random() * 2,
                    v: Math.random() * 0.5 + 0.1
                }));
                function draw() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = 'rgba(255,255,255,0.3)';
                    stars.forEach(star => {
                        ctx.beginPath();
                        ctx.arc(star.x, star.y, star.s, 0, Math.PI * 2);
                        ctx.fill();
                        star.y -= star.v;
                        if (star.y < 0) star.y = canvas.height;
                    });
                    requestAnimationFrame(draw);
                }
                draw();
            }
        });
    </script>
</body>
</html>
