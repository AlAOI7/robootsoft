<!DOCTYPE html>
<html lang="ar" dir="rtl" >
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعدادات الموقع | Robotsoft Admin</title>
    <link rel="stylesheet" href="css/admin-style.css?v=5">
    <link rel="icon" type="image/jpeg" href="../assets/logo.jpeg">
</head>
<body>
    
    <!-- Sidebar -->
    <aside class="admin-sidebar" id="admin-sidebar">
        <!-- Reusing same sidebar structure... -->
        <div class="sidebar-header">
            <a href="index.html" class="sidebar-logo"><img src="../assets/logo.jpeg" alt="Logo"><span>Robotsoft Admin</span></a>
        </div>
        <div class="sidebar-menu">
            <a href="index.html" class="menu-item"><span>الرئيسية</span></a>
            <a href="services.html" class="menu-item"><span>إدارة الخدمات</span></a>
            <a href="projects.html" class="menu-item"><span>المشاريع</span></a>
            <a href="clients.html" class="menu-item"><span>العملاء</span></a>
            <a href="blog.html" class="menu-item"><span>المدونة</span></a>
            <a href="users.html" class="menu-item"><span>المستخدمين والصلاحيات</span></a>
            <a href="messages.html" class="menu-item"><span>الرسائل والطلبات</span></a>
            <a href="settings.html" class="menu-item active"><span>الإعدادات</span></a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
        <header class="admin-header">
            <div style="display:flex; align-items:center; gap: 15px;">
                <div class="header-search" style="opacity:0; pointer-events:none;">
                    <input type="text">
                </div>
            </div>
            <div class="header-actions">
                <div class="user-profile"><img src="../assets/logo.jpeg" alt="Admin"><span style="font-weight:700;">المدير العام</span></div>
            </div>
        </header>

        <div class="page-content">
            <div class="page-header">
                <h1 class="page-title">إعدادات الموقع العامة</h1>
                <button class="btn btn-primary" onclick="alert('تم حفظ كافة الإعدادات بنجاح!')">حفظ الإعدادات</button>
            </div>

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:2rem;">
                <!-- General Info Card -->
                <div class="data-card" style="padding: 2rem;">
                    <h3 style="margin-bottom: 1.5rem; font-size:1.2rem; font-weight:700; display:flex; align-items:center; gap:10px;">
                        <svg width="24" height="24" fill="none" stroke="var(--primary)" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        المعلومات الأساسية
                    </h3>
                    <form>
                        <div class="form-group">
                            <label class="form-label">اسم الموقع</label>
                            <input type="text" class="form-control" value="Robotsoft ERP">
                        </div>
                        <div class="form-group">
                            <label class="form-label">وصف الموقع (SEO Description)</label>
                            <textarea class="form-control" rows="3">Robotsoft ERP يقدم أقوى أنظمة المحاسبة السحابية والمحلية المتكاملة لإدارة المبيعات...</textarea>
                        </div>
                        <div class="form-group">
                            <label class="form-label">الكلمات المفتاحية (SEO Keywords)</label>
                            <textarea class="form-control" rows="3">أفضل نظام محاسبي, ERP سحابي, برنامج مبيعات, محاسبة الشركات...</textarea>
                        </div>
                        <div class="form-group">
                            <label class="form-label">شعار الموقع (Logo)</label>
                            <input type="file" class="form-control" accept="image/*">
                        </div>
                    </form>
                </div>

                <!-- Contact & Social Card -->
                <div class="data-card" style="padding: 2rem;">
                    <h3 style="margin-bottom: 1.5rem; font-size:1.2rem; font-weight:700; display:flex; align-items:center; gap:10px;">
                        <svg width="24" height="24" fill="none" stroke="var(--accent)" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                        التواصل والشبكات الاجتماعية
                    </h3>
                    <form>
                        <div class="form-group">
                            <label class="form-label">رقم الجوال الرئيسي (WhatsApp)</label>
                            <input type="text" class="form-control" value="966500000000" dir="ltr" style="text-align:left;">
                        </div>
                        <div class="form-group">
                            <label class="form-label">البريد الإلكتروني</label>
                            <input type="email" class="form-control" value="info@robotsoft.com" dir="ltr" style="text-align:left;">
                        </div>
                        <div class="form-group">
                            <label class="form-label">العنوان</label>
                            <input type="text" class="form-control" value="الرياض - المملكة العربية السعودية">
                        </div>
                        <div class="form-group">
                            <label class="form-label">رابط تويتر (X)</label>
                            <input type="url" class="form-control" value="https://twitter.com/robotsofterp" dir="ltr" style="text-align:left;">
                        </div>
                        <div class="form-group">
                            <label class="form-label">رابط لينكد إن (LinkedIn)</label>
                            <input type="url" class="form-control" value="https://linkedin.com/company/robotsofterp" dir="ltr" style="text-align:left;">
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="js/admin-main.js"></script>
</body>
</html>
