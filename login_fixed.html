    <meta property="og:title" content="تسجيل الدخول | Robotsoft ERP">
    <meta property="og:description" content="الوصول الآمن إلى لوحة تحكم نظام Robotsoft ERP السحابي.">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/jpeg" href="assets/logo.jpeg">
    <style>
        .auth-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; background: #0f172a; }
        .auth-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .auth-card { position: relative; z-index: 2; width: 100%; max-width: 450px; background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 3rem; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .auth-logo { text-align: center; margin-bottom: 2rem; }
        .auth-logo img { width: 60px; height: 60px; border-radius: 12px; margin-bottom: 1rem; }
        .auth-logo h2 { font-size: 1.8rem; font-weight: 800; color: #fff; }
        .auth-logo p { color: var(--text-muted); font-size: 0.95rem; margin-top: 0.5rem; }
        .form-group { margin-bottom: 1.5rem; }
        .form-label { display: block; font-size: 0.9rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.5rem; }
        .form-input { width: 100%; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 1rem; color: #fff; font-size: 1rem; transition: all 0.3s ease; }
        .form-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(37,99,235,0.1); }
        .form-options { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; font-size: 0.9rem; }
        .auth-btn { width: 100%; padding: 1rem; border: none; border-radius: 12px; background: var(--gradient-primary); color: #fff; font-weight: 700; font-size: 1.1rem; cursor: pointer; transition: all 0.3s ease; }
        .auth-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(37,99,235,0.3); }
        .auth-footer { text-align: center; margin-top: 2rem; font-size: 0.95rem; color: var(--text-secondary); }
        .auth-footer a { color: var(--primary); font-weight: 600; text-decoration: none; }
        .auth-footer a:hover { text-decoration: underline; }
        
        .social-login { display: flex; gap: 1rem; margin-bottom: 2rem; }
        .social-btn { flex: 1; padding: 0.75rem; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: #fff; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: all 0.3s ease; }
        .social-btn:hover { background: rgba(255,255,255,0.1); }
        .divider { display: flex; align-items: center; text-align: center; margin: 1.5rem 0; color: var(--text-muted); font-size: 0.85rem; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .divider:not(:empty)::before { margin-left: 1rem; }
        .divider:not(:empty)::after { margin-right: 1rem; }
    </style>
</head>
<body>
    <div class="auth-container">
        <canvas id="auth-canvas" class="auth-canvas"></canvas>
        <div class="auth-card reveal">
            <div class="auth-logo">
                <a href="index.html">
                    <img src="assets/logo.jpeg" alt="Robotsoft Logo">
                </a>
                <h2 data-ar="تسجيل الدخول" data-en="Welcome Back">مرحباً بعودتك</h2>
                <p data-ar="الوصول إلى لوحة التحكم الخاصة بنظامك" data-en="Access your ERP dashboard">الوصول إلى لوحة التحكم الخاصة بنظامك</p>
            </div>
            
            <div class="social-login">
                <button class="social-btn">
                    <svg viewBox="0 0 24 24" width="24" height="24" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                </button>
                <button class="social-btn">
                    <svg viewBox="0 0 24 24" width="24" height="24" xmlns="http://www.w3.org/2000/svg"><path d="M22 12c0-5.52-4.48-10-10-10S2 6.48 2 12c0 4.84 3.44 8.87 8 9.8V15H8v-3h2V9.5C10 7.57 11.57 6 13.5 6H16v3h-2c-.55 0-1 1v2h3v3h-3v6.95c5.05-.5 9-4.76 9-9.95z" fill="#1877F2"/></svg>
                </button>
            </div>

            <div class="divider" data-ar="أو الدخول بالبريد" data-en="Or login with email">أو الدخول بالبريد</div>

            <form onsubmit="event.preventDefault(); window.location.href='index.html';">
                <div class="form-group">
                    <label class="form-label" data-ar="البريد الإلكتروني" data-en="Email Address">البريد الإلكتروني</label>
                    <input type="email" class="form-input" required placeholder="name@company.com">
                </div>
                <div class="form-group">
                    <label class="form-label" data-ar="كلمة المرور" data-en="Password">كلمة المرور</label>
                    <input type="password" class="form-input" required placeholder="••••••••">
                </div>
                <div class="form-options">
                    <label style="display: flex; align-items: center; gap: 0.5rem; color: var(--text-secondary); cursor: pointer;">
                        <input type="checkbox" checked style="accent-color: var(--primary);">
                        <span data-ar="تذكرني" data-en="Remember me">تذكرني</span>
                    </label>
                    <a href="#" style="color: var(--primary); text-decoration: none;" data-ar="نسيت كلمة المرور؟" data-en="Forgot password?">نسيت كلمة المرور؟</a>
                </div>
                <button type="submit" class="auth-btn" data-ar="دخول" data-en="Sign In">دخول</button>
            </form>

            <div class="auth-footer">
                <span data-ar="ليس لديك حساب؟" data-en="Don't have an account?">ليس لديك حساب؟</span> 
                <a href="signup.html" data-ar="سجل الآن" data-en="Sign up now">سجل الآن</a>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('auth-canvas');
            if (canvas && window.innerWidth > 768) {
                const ctx = canvas.getContext('2d');
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                const stars = Array.from({length: 100}).map(() => ({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    s: Math.random() * 2,
                    v: Math.random() * 0.5 + 0.1
                }));
                function draw() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = 'rgba(255,255,255,0.5)';
                    stars.forEach(star => {
                        ctx.beginPath();
                        ctx.arc(star.x, star.y, star.s, 0, Math.PI * 2);
                        ctx.fill();
                        star.y -= star.v;
                        if (star.y < 0) star.y = canvas.height;
                    });
                    requestAnimationFrame(draw);
                }
                draw();
            }
        });
    </script>
</body>
